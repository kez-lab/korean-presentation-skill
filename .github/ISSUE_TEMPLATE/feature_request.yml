name: 기능 제안 (Feature request)
description: 새로운 레이아웃, 감사 규칙, 또는 파이프라인 기능을 제안합니다.
labels: [enhancement]
body:
  - type: dropdown
    id: area
    attributes:
      label: 어느 영역인가요?
      options:
        - 레이아웃 / 디자인 테마
        - 감사 규칙 (governance rule)
        - PPTX 변환 충실도
        - CLI / 개발자 경험
        - 문서
        - 기타
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 어떤 문제를 해결하나요?
      description: 제안하는 기능보다 먼저, 현재 무엇이 불편한지 적어주세요.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 제안 내용
      description: 새 감사 규칙이라면 어떤 조건에서 error/warn 을 내야 하는지도 함께 적어주세요.
    validations:
      required: true
